name: Deploy and benchmark

# Builds the Bun variants natively on an x86_64 and an arm64 runner, which is what the --aot
# variants need, then deploys every function on both architectures and benchmarks them.
# Needs the repository secret AWS_ROLE_ARN: a role this repo may assume through GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        default: eu-central-1
      rounds:
        default: '3'
      cold:
        description: Concurrent cold invocations per round
        default: '10'
      remove:
        description: Remove the stack afterwards
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency: bench

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          # GitHub's arm64 runners are Neoverse N2, Lambda's Graviton2 is N1. An --aot executable
          # that dies with SIGILL on Lambda would point at that.
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # In an Amazon Linux 2023 container with the pinned AOT build of Bun; see infra/build-image.sh.
      - run: bun run build --arch ${{ matrix.arch }}
      # Artifacts drop file modes, and every bootstrap must stay executable.
      - run: tar -cf bundles-${{ matrix.arch }}.tar -C dist ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.arch }}
          path: bundles-${{ matrix.arch }}.tar
          retention-days: 3

  bench:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SST_TELEMETRY_DISABLED: '1'
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
      - run: |
          mkdir -p dist
          for tar in bundles-*.tar; do tar -xf "$tar" -C dist; done
      - run: bunx sst deploy --stage bench
        env:
          LAMBDA_ARCH: x86_64,arm64
          BUN_BUNDLES: dist
      - run: bun run bench --rounds ${{ inputs.rounds }} --cold ${{ inputs.cold }}
      - run: cat bench-results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results
      - if: inputs.remove
        run: bunx sst remove --stage bench
        env:
          LAMBDA_ARCH: x86_64,arm64
          BUN_BUNDLES: dist
