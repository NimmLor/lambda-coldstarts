name: Deploy and benchmark

# Deploys from an x86_64 Linux runner, which is what the --aot variants need, then benchmarks.
# Needs the repository secret AWS_ROLE_ARN: a role this repo may assume through GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        default: eu-central-1
      aot:
        description: Install the pinned AOT build of Bun (oven-sh/bun#45631); off skips the --trim and --aot variants
        type: boolean
        default: true
      rounds:
        default: '3'
      cold:
        description: Concurrent cold invocations per round
        default: '10'
      remove:
        description: Remove the stack afterwards
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency: bench

jobs:
  bench:
    runs-on: ubuntu-24.04
    env:
      SST_TELEMETRY_DISABLED: '1'
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - run: bun install --frozen-lockfile
      # oven-sh/bun#45631, Buildkite build #133641 (1.4.4-canary.1+72ab4f530); artifacts expire ~2027-04-25.
      - name: Install the AOT build of Bun
        if: inputs.aot
        run: |
          mkdir -p ~/.bun-aot && cd ~/.bun-aot
          curl -fL -o bun-linux-x64.zip "https://buildkite.com/organizations/bun/pipelines/bun/builds/133641/jobs/01a17d0b-2f8a-4994-b0d1-5aefc929366e/artifacts/01a17d12-dc53-4bb8-9856-d357395550f1"
          echo "2bb09f3c5b9966dc5160ebc87e8bc981e7ea5dc6c511227943fb6065e06a7461  bun-linux-x64.zip" | sha256sum -c
          unzip -o bun-linux-x64.zip && chmod +x bun-linux-x64/bun
          bun-linux-x64/bun --revision
          echo "BUN_AOT_BIN=$HOME/.bun-aot/bun-linux-x64/bun" >> "$GITHUB_ENV"
      - run: bunx sst deploy --stage bench
      - run: bun run bench --rounds ${{ inputs.rounds }} --cold ${{ inputs.cold }}
      - run: cat bench-results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results
      - if: inputs.remove
        run: bunx sst remove --stage bench
