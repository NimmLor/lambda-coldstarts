name: CI

# Pull requests only: on main, deploy.yml runs the same checks and builds before it deploys.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # bun lint is only in canary so far.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bunx sst install --stage ci
        env:
          SST_TELEMETRY_DISABLED: '1'
      - run: bun run typecheck
      - run: bun lint --max-warnings 0
      - run: bun fmt --check
      - run: bun test

  # Builds the Bun and LLRT variants natively per architecture and runs each bootstrap against a fake
  # Runtime API, in the same container the deploy builds in.
  build:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run build --arch ${{ matrix.arch }}
