<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Linked from nowhere; PerfApi's admin routes check the secret, this page only sends it. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Self-hosted fonts, inline so the bundler leaves their URLs alone; build.ts and dev.ts serve /fonts. -->
    <style>
      @font-face {
        font-family: 'Host Grotesk';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/host-grotesk-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Host Grotesk';
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/host-grotesk-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Mono';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Mono';
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-mono-latin-500-normal.woff2') format('woff2');
      }
    </style>
    <title>Admin</title>
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <header
      class="mx-auto flex w-full max-w-(--container) flex-col gap-6 px-(--gutter) pt-10 pb-10 sm:pt-16"
    >
      <a href="/" class="self-start text-sm">Bun vs Node.js cold start benchmark</a>
      <h1 class="text-3xl">Admin</h1>
    </header>

    <main class="mx-auto w-full max-w-(--container) px-(--gutter) pb-16">
      <form
        id="admin"
        class="flex max-w-xl flex-col gap-5 rounded-card border border-rule bg-paper-2 p-5 sm:p-6"
      >
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-ink">Secret</span>
          <input
            name="secret"
            type="password"
            autocomplete="current-password"
            required
            class="measured min-h-11 rounded-card border border-rule-2 bg-paper-3 px-3 text-ink"
          />
        </label>
        <div class="flex flex-wrap gap-3">
          <button type="submit" name="action" value="run" class="btn btn--primary">
            Start a run
          </button>
          <button type="submit" name="action" value="purge" class="btn text-bad">
            Purge PerfResults
          </button>
        </div>
        <output id="log" class="measured text-sm whitespace-pre-wrap" aria-live="polite"></output>
      </form>
    </main>

    <script type="module" src="./src/admin.ts"></script>
  </body>
</html>
