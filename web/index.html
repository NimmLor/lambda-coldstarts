<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cold start, warm start, memory and size for Bun, LLRT and Node.js on AWS Lambda, measured every 4 hours."
    />
    <!-- Same origin only: no fonts, scripts, styles or images from third parties. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Self-hosted fonts from fonts/, inline so the bundler leaves their URLs alone; build.ts and dev.ts serve /fonts. -->
    <style>
      @font-face {
        font-family: 'Host Grotesk';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/host-grotesk-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Host Grotesk';
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/host-grotesk-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Mono';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Mono';
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-mono-latin-500-normal.woff2') format('woff2');
      }
    </style>
    <link rel="icon" href="./src/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://coldstarts.github.nimmervoll.work/" />
    <!-- What the page charts, for search engines' dataset listings; the data is /api/runs/latest. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Bun vs LLRT vs Node.js cold starts on AWS Lambda",
        "description": "Cold start, warm start, memory and size for Bun, LLRT and Node.js on AWS Lambda, measured every 4 hours.",
        "url": "https://coldstarts.github.nimmervoll.work/",
        "sameAs": "https://github.com/NimmLor/lambda-coldstarts",
        "creator": { "@type": "Person", "name": "Lorenz Nimmervoll" },
        "isAccessibleForFree": true,
        "keywords": ["AWS Lambda", "cold start", "Bun", "Node.js", "LLRT", "benchmark"],
        "variableMeasured": ["Cold start duration", "Warm start duration", "Memory used", "Size"],
        "distribution": {
          "@type": "DataDownload",
          "encodingFormat": "application/json",
          "contentUrl": "https://coldstarts.github.nimmervoll.work/api/runs/latest"
        }
      }
    </script>
    <!-- og.png is `bun run og`'s render of og.html; build.ts copies it to the site's root. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://coldstarts.github.nimmervoll.work/" />
    <meta property="og:title" content="Lambda cold starts: Bun vs LLRT vs Node.js" />
    <meta
      property="og:description"
      content="Cold start, warm start, memory and size for Bun, LLRT and Node.js on AWS Lambda, measured every 4 hours."
    />
    <meta property="og:image" content="https://coldstarts.github.nimmervoll.work/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bun vs LLRT vs Node.js cold starts on AWS Lambda: cold start, warm start, memory and duration, measured every 4 hours."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Lambda cold starts: Bun vs LLRT vs Node.js</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/frontend.tsx"></script>
  </body>
</html>
