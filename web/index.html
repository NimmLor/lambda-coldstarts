<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bun against Node.js on AWS Lambda: cold start, warm start, memory and size, measured every hour."
    />
    <!-- Same origin only: no fonts, scripts, styles or images from third parties. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Self-hosted fonts from fonts/, inline so the bundler leaves their URLs alone; build.ts and dev.ts serve /fonts. -->
    <style>
      @font-face {
        font-family: 'Host Grotesk';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/host-grotesk-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Host Grotesk';
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/host-grotesk-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Mono';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Mono';
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-mono-latin-500-normal.woff2') format('woff2');
      }
    </style>
    <title>Bun vs Node.js cold starts on AWS Lambda</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/frontend.tsx"></script>
  </body>
</html>
