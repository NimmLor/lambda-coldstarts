# Vendored agent skills, a design export and files SST generates stay out of both.
[fmt]
printWidth = 100
semi = false
singleQuote = true
trailingComma = "es5"
ignorePatterns = [".agents/", ".hallmark/", "design.html", "skills-lock.json", "**/sst-env.d.ts"]

[lint]
ignorePatterns = [".agents/", ".hallmark/", "**/sst-env.d.ts"]
